<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roots Grill Cloud | Store Manager</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#f5f6f7;background:#080a0d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#351014,transparent 40%),#080a0d;min-height:100vh}button,input{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:22px max(24px,calc((100vw - 1160px)/2));border-bottom:1px solid #252830;background:#111319}header strong{font-size:20px}header small{display:block;color:#9fa4af;margin-top:4px}.brand{display:flex;align-items:center;gap:12px}.logo{background:#d71920;border-radius:12px;padding:12px;font-weight:900}main{max-width:1160px;margin:35px auto;padding:0 24px}.muted{color:#a5a9b2}.panel,.metric,.screen{background:#15181e;border:1px solid #292e38;border-radius:18px;padding:22px}.panel{max-width:430px;margin:80px auto}.panel input{display:block;width:100%;padding:14px;margin:12px 0;background:#0b0d12;color:#fff;border:1px solid #3b404b;border-radius:10px}.primary{border:0;border-radius:10px;background:#d71920;color:#fff;font-weight:700;padding:13px 18px}.secondary{border:1px solid #454a53;background:#20242b;color:white;border-radius:10px;padding:10px 14px}.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:15px;margin-bottom:25px}.toolbar h1{margin:0;font-size:clamp(26px,4vw,38px)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:22px 0 34px}.metric span{color:#a5a9b2;font-size:14px}.metric strong{display:block;font-size:36px;margin-top:8px}.screens{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:15px}.screen h3{margin:0 0 7px}.screen p{color:#a5a9b2;font-size:14px}.screen .media{border-top:1px solid #2b3039;margin-top:18px;padding-top:15px;overflow-wrap:anywhere}.tag{display:inline-block;padding:6px 10px;border-radius:30px;font-size:12px;font-weight:700;background:#393239;color:#ffb3b7}.tag.online{background:#143b2b;color:#86e7ad}.tag.disabled{background:#393d44;color:#c4c7cd}.message{min-height:24px;color:#ffb4b8}.store{margin-bottom:34px}.store h2{font-size:20px}#userEmail{overflow-wrap:anywhere}@media(max-width:680px){.metrics{grid-template-columns:repeat(2,1fr)}header{padding:16px 20px}.metric{padding:17px}.metric strong{font-size:29px}}
</style></head><body>
<header><div class="brand"><div class="logo">RG</div><div><strong>Roots Grill Cloud</strong><small>Store Manager Portal</small></div></div><button id="logout" class="secondary" hidden>Sign out</button></header>
<main><section id="login" class="panel" hidden><h1>Manager Sign In</h1><p class="muted">Sign in with the email and password you created from your invitation.</p><form id="loginForm"><input id="email" type="email" placeholder="Email address" autocomplete="username" required><input id="password" type="password" placeholder="Password" autocomplete="current-password" required><button class="primary" type="submit">Sign in</button></form><p id="loginError" class="message"></p></section>
<section id="dashboard" hidden><div class="toolbar"><div><p class="muted">YOUR BRANCH NETWORK</p><h1 id="greeting">Store Overview</h1><p class="muted" id="userEmail"></p></div><button class="secondary" id="refresh">Refresh status</button></div><div class="metrics"><div class="metric"><span>My stores</span><strong id="storesCount">0</strong></div><div class="metric"><span>Registered TVs</span><strong id="tvCount">0</strong></div><div class="metric"><span>Online</span><strong id="onlineCount">0</strong></div><div class="metric"><span>Offline / Disabled</span><strong id="offlineCount">0</strong></div></div><div id="storeSections"></div><p class="muted" id="updated"></p><p class="message" id="error"></p></section><p id="loading" class="muted">Checking your session…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const url='https://zvezbdoghzbrsvxazfwo.supabase.co',key='sb_publishable_IpUt3RpCm0f9Hlyiy_lRkA_GOuhS1pO';
const db=supabase.createClient(url,key),$=id=>document.getElementById(id);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
async function api(){const {data:{session}}=await db.auth.getSession();if(!session)throw Error('Please sign in again');const response=await fetch(url+'/functions/v1/store-accounts',{method:'POST',headers:{'content-type':'application/json',apikey:key,authorization:'Bearer '+session.access_token},body:JSON.stringify({action:'managerOverview'})});const data=await response.json();if(!response.ok)throw Error(data.error||'Unable to load your store');return data;}
function showLogin(){$('loading').hidden=true;$('dashboard').hidden=true;$('login').hidden=false;$('logout').hidden=true;}
function showDashboard(){$('loading').hidden=true;$('login').hidden=true;$('dashboard').hidden=false;$('logout').hidden=false;}
async function load(){
 const data=await api();const now=new Date(data.serverTime).getTime(),screens=data.screens||[],stores=data.stores||[];
 const isOnline=s=>!s.disabled&&s.last_seen&&now-new Date(s.last_seen).getTime()<90000;
 $('storesCount').textContent=stores.length;$('tvCount').textContent=screens.length;
 $('onlineCount').textContent=screens.filter(isOnline).length;$('offlineCount').textContent=screens.filter(s=>!isOnline(s)).length;
 const firstName=String(data.managerName||'').trim().split(/\s+/)[0];$('greeting').textContent=firstName?'Welcome, '+firstName+'!':'Store Overview';$('userEmail').textContent=data.email||'';
 $('storeSections').innerHTML=stores.map(store=>{
 const assigned=screens.filter(s=>s.store_id===store.id);
 return '<section class="store"><h2>'+safe(store.name)+'</h2><p class="muted">'+assigned.length+' registered screen(s)</p><div class="screens">'+(assigned.length?assigned.map(s=>'<article class="screen"><h3>'+safe(s.label)+'</h3><p>'+safe(s.location||'No location')+' · '+safe(s.display||'landscape')+'</p><span class="tag '+(s.disabled?'disabled':isOnline(s)?'online':'')+'">'+(s.disabled?'Disabled':isOnline(s)?'Online':'Offline')+'</span><div class="media"><p>Now playing</p><strong>'+safe(s.current_media_name||'No current media reported')+'</strong></div>'+(s.playback_issue?'<p>'+safe(s.playback_issue)+'</p>':'')+'</article>').join(''):'<div class="screen"><p>No TVs assigned yet. Head Office can assign a screen to this store.</p></div>')+'</div></section>';
 }).join('');
 $('updated').textContent='Last checked: '+new Date().toLocaleString();$('error').textContent='';showDashboard();
}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='Signing in…';try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await load();$('loginError').textContent='';}catch(e){$('loginError').textContent=e.message;}};
$('refresh').onclick=()=>load().catch(e=>$('error').textContent=e.message);
$('logout').onclick=async()=>{await db.auth.signOut();showLogin();};
(async()=>{try{const {data:{session}}=await db.auth.getSession();if(session)await load();else showLogin();}catch(e){showLogin();$('loginError').textContent=e.message;}})();
</script></body></html>
