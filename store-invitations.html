<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roots Grill | Store Invitation Test</title><style>body{font:16px system-ui;background:#0b0d10;color:#fff;margin:0;padding:30px}main{max-width:550px;margin:auto;background:#171a20;padding:28px;border-radius:20px}input,select,button{display:block;width:100%;box-sizing:border-box;padding:12px;margin:12px 0;background:#0b0d10;color:white;border:1px solid #555;border-radius:9px}button{background:#d71920;border:0;cursor:pointer}p{color:#b9bec7}</style></head><body><main><h1>Store Invitations</h1><p>Head Office only. Sign in with your existing admin account to invite a test manager.</p><form id="login"><input id="email" type="email" placeholder="Head Office email" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button></form><section id="panel" hidden><p id="who"></p><button id="logout">Sign out</button><h2>Create store</h2><form id="create"><input id="storeName" placeholder="Store name" required><button>Create store</button></form><h2>Invite manager</h2><form id="invite"><select id="stores" required></select><input id="managerName" type="text" placeholder="Manager full name" minlength="2" maxlength="80" autocomplete="name" required><input id="managerEmail" type="email" placeholder="Manager email" required><button>Send invitation email</button></form></section><p id="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const key='sb_publishable_IpUt3RpCm0f9Hlyiy_lRkA_GOuhS1pO',url='https://zvezbdoghzbrsvxazfwo.supabase.co',db=supabase.createClient(url,key);
const $=id=>document.getElementById(id),status=$('status');
async function api(body){const {data:{session}}=await db.auth.getSession();if(!session)throw new Error('Sign in first');const res=await fetch(url+'/functions/v1/store-accounts',{method:'POST',headers:{'content-type':'application/json',apikey:key,authorization:'Bearer '+session.access_token},body:JSON.stringify(body)});const data=await res.json();if(!res.ok)throw new Error(data.error||'Request failed');return data;}
async function refresh(){const data=await api({action:'stores'});$('stores').replaceChildren(...data.stores.map(s=>{const o=document.createElement('option');o.value=s.id;o.textContent=s.name;return o;}));$('login').hidden=true;$('panel').hidden=false;const {data:{user}}=await db.auth.getUser();$('who').textContent=user.email;}
$('login').onsubmit=async e=>{e.preventDefault();status.textContent='Signing in…';try{const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)throw error;await refresh();status.textContent='Signed in.';}catch(err){status.textContent=err.message;}};
$('create').onsubmit=async e=>{e.preventDefault();status.textContent='Creating store…';try{const result=await api({action:'createStore',name:$('storeName').value});await refresh();$('stores').value=result.store.id;status.textContent='Store created. You can invite its manager now.';}catch(err){status.textContent=err.message;}};
$('invite').onsubmit=async e=>{e.preventDefault();status.textContent='Requesting invitation email…';try{const result=await api({action:'invite',storeId:$('stores').value,email:$('managerEmail').value,managerName:$('managerName').value.trim()});status.textContent=result.message;}catch(err){status.textContent=err.message;}};
$('logout').onclick=async()=>{await db.auth.signOut();$('panel').hidden=true;$('login').hidden=false;status.textContent='Signed out.';};
(async()=>{try{const {data:{session}}=await db.auth.getSession();if(session)await refresh();}catch(e){status.textContent=e.message;}})();
</script></body></html>
