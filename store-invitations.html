<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roots Grill Cloud | Create Store</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#f6f7f9;background:#090b0f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#35151b,transparent 45%),#090b0f;display:grid;place-items:center;padding:24px}main{width:min(100%,540px);text-align:center}.logo{display:inline-grid;place-items:center;width:60px;height:60px;background:#d71920;border-radius:17px;font-weight:900;font-size:22px;margin-bottom:16px}h1{font-size:clamp(27px,5vw,37px);margin:0 0 10px}p{color:#aeb3bd;line-height:1.6}.panel{margin-top:24px;background:#16191f;border:1px solid #30343e;border-radius:22px;padding:clamp(24px,5vw,36px);box-shadow:0 20px 60px #0005}.panel[hidden],section[hidden],form[hidden],button[hidden],div[hidden]{display:none!important}input{width:100%;padding:17px 18px;background:#0c0e13;border:1px solid #424650;border-radius:12px;color:#fff;font:inherit;text-align:center;outline:none;margin:18px 0 14px}input:focus{border-color:#ed414a;box-shadow:0 0 0 3px #d7192029}button{border:0;border-radius:12px;padding:15px 22px;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.primary{background:#d71920;color:#fff;width:100%}.ghost{background:transparent;color:#c9cdd4}.nav{display:flex;align-items:center;gap:12px}.nav .primary{flex:1}.nav .ghost{flex:0 0 auto}.progress{display:flex;justify-content:center;gap:8px;margin-bottom:26px}.dot{height:6px;width:34px;border-radius:8px;background:#3b4049}.dot.active{background:#e42c35}.eyebrow{font-size:12px;letter-spacing:2px;color:#e64a51;font-weight:800;text-transform:uppercase}.detail{font-size:14px;color:#b5bac4}.error{min-height:24px;color:#ff9fa5;font-size:14px;margin:14px 0 0}.success{font-size:20px;color:#9ee6b4;font-weight:750}.link{color:#f0a0a4;text-decoration:underline;cursor:pointer}.subtle{font-size:13px}#logout{margin-top:20px}#who{font-size:13px}
</style></head><body><main><div class="logo">RG</div><h1>Roots Grill Cloud</h1><p>Store onboarding, made simple.</p>
<section id="loginPanel" class="panel" hidden><div class="eyebrow">Head Office Access</div><h2>Welcome back</h2><p>Sign in to set up a new branch.</p><form id="login"><input id="email" type="email" autocomplete="username" placeholder="Head Office email" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button class="primary" type="submit">Sign in</button></form></section>
<section id="wizard" class="panel" hidden><div class="progress"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div><div class="eyebrow" id="stepLabel">Step 1 of 3</div><h2 id="question">What's the store name?</h2><p id="hint">You can set up a store even if it has no TVs yet.</p><form id="stepForm"><input id="answer" type="text" required autocomplete="off" placeholder="e.g. Roots Grill Sandton"><div class="nav"><button id="back" type="button" class="ghost" hidden>Back</button><button id="next" type="submit" class="primary">Continue</button></div></form><p id="summary" class="detail"></p></section>
<section id="complete" class="panel" hidden><div style="font-size:48px">✓</div><h2>Invitation sent!</h2><p id="completeText"></p><button class="primary" id="again">Create another store</button></section>
<p id="status" class="error" role="status" aria-live="polite"></p><p id="who"></p><button id="logout" class="ghost" hidden>Sign out</button></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const key='sb_publishable_IpUt3RpCm0f9Hlyiy_lRkA_GOuhS1pO',url='https://zvezbdoghzbrsvxazfwo.supabase.co',db=supabase.createClient(url,key);
const $=id=>document.getElementById(id),fields=['storeName','managerName','managerEmail'],values={storeName:'',managerName:'',managerEmail:''};
const steps=[{question:"What's the store name?",hint:'Your branch can be created before any TVs are paired.',placeholder:'e.g. Roots Grill Sandton',type:'text',max:100},{question:"What's the manager's name?",hint:'This name will appear on their welcome screen and dashboard.',placeholder:'e.g. Fortune M',type:'text',max:80},{question:"What's the manager's email?",hint:'We will email a secure invitation to this address.',placeholder:'manager@example.com',type:'email',max:254}];
let step=0,busy=false,pendingStore=null;
async function api(body){const {data:{session}}=await db.auth.getSession();if(!session)throw Error('Sign in first');const res=await fetch(url+'/functions/v1/store-accounts',{method:'POST',headers:{'content-type':'application/json',apikey:key,authorization:'Bearer '+session.access_token},body:JSON.stringify(body)});const data=await res.json();if(!res.ok)throw Error(data.error||'Request failed');return data;}
function view(name){for(const id of ['loginPanel','wizard','complete'])$(id).hidden=id!==name;$('logout').hidden=name==='loginPanel';}
function render(){const current=steps[step];$('stepLabel').textContent='Step '+(step+1)+' of 3';$('question').textContent=current.question;$('hint').textContent=current.hint;$('answer').type=current.type;$('answer').placeholder=current.placeholder;$('answer').maxLength=current.max;$('answer').value=values[fields[step]];$('answer').autocomplete=step===1?'name':step===2?'email':'off';$('back').hidden=step===0;$('next').textContent=step===2?'Create store & send invitation':'Continue';document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i<=step));$('summary').textContent=step===0?'':step===1?values.storeName:values.storeName+' · '+values.managerName;$('status').textContent='';view('wizard');$('answer').focus();}
function validate(value){if(step===0&&(value.length<3||value.length>100))return 'Store name must be 3–100 characters.';if(step===1&&(value.length<2||value.length>80))return 'Manager name must be 2–80 characters.';if(step===2&&!/^\S+@\S+\.\S+$/.test(value))return 'Enter a valid email address.';return '';}
$('stepForm').onsubmit=async e=>{e.preventDefault();if(busy)return;const value=$('answer').value.trim().replace(/\s+/g,' '),err=validate(value);if(err){$('status').textContent=err;return;}values[fields[step]]=value;if(step<2){step++;render();return;}
busy=true;$('next').disabled=true;$('back').disabled=true;$('next').textContent='Creating your store…';$('status').textContent='';
try{if(!pendingStore){const created=await api({action:'createStore',name:values.storeName});pendingStore=created.store;}
 $('next').textContent='Sending invitation…';
 const result=await api({action:'invite',storeId:pendingStore.id,managerName:values.managerName,email:values.managerEmail});
 $('completeText').textContent=values.managerName+' has been invited to manage '+pendingStore.name+'. No TVs need to be paired yet. '+(result.message||'');
 view('complete');
}catch(error){$('status').textContent=error.message+(pendingStore?' The store has already been created; retry will not create a duplicate.':'');}finally{busy=false;$('next').disabled=false;$('back').disabled=false;$('next').textContent='Create store & send invitation';}};
$('back').onclick=()=>{if(busy||step===0)return;values[fields[step]]=$('answer').value.trim();step--;render();};
$('again').onclick=()=>{step=0;pendingStore=null;for(const key of fields)values[key]='';render();};
$('login').onsubmit=async e=>{e.preventDefault();$('status').textContent='Signing in…';try{const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)throw error;await api({action:'stores'});const {data:{user}}=await db.auth.getUser();$('who').textContent='Head Office · '+user.email;render();}catch(err){$('status').textContent=err.message;}};
$('logout').onclick=async()=>{await db.auth.signOut();pendingStore=null;view('loginPanel');$('who').textContent='';$('status').textContent='';};
(async()=>{try{const {data:{session}}=await db.auth.getSession();if(session){await api({action:'stores'});$('who').textContent='Head Office · '+session.user.email;render();}else view('loginPanel');}catch(err){view('loginPanel');$('status').textContent=err.message;}})();
</script></body></html>
