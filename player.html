<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roots Grill Cloud — Universal TV Player</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#universalStage{position:fixed;inset:0;background:#000}
#slideshow{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;background:#000}
#slideshow .slide{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none}
#slideshow .slide.active{opacity:1;pointer-events:auto;z-index:1}
#slideshow .slide img,#slideshow .slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#portraitStage{position:fixed;top:50%;left:50%;width:100vh;height:100vw;transform:translate(-50%,-50%) rotate(270deg);transform-origin:center;overflow:hidden;background:#000;contain:strict}
#portraitScreen{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;background:#000;border:0;margin:0;padding:0}
#portraitFallback{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:600 18px system-ui,sans-serif;background:#000}
</style></head><body><div id="universalStage"></div>
<script src="universal-player.js?v=20261123-bookmark-v2"></script></body></html>
