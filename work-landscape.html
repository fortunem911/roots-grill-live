<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roots Grill Display</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body.display-page {
      background: #000;
      cursor: none;
    }

    body.display-page #slideshow {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    body.display-page #slideshow .slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
      background: #000;
      transition: none;
    }

    body.display-page #slideshow .slide.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 1;
    }

    body.display-page #slideshow .slide img,
    body.display-page #slideshow .slide video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }
  </style>
</head>

<body class="display-page" data-display="landscape">
  <main id="slideshow" class="slideshow" aria-live="off"></main>
  <script src="work-pairing.js?v=20261123-v1" data-screen-id="roots-grill-landscape-01"></script>
  <script src="cloud-player.js"></script>
</body>
</html>
