<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roots Grill | Manager Invitation</title><style>body{font:16px system-ui;background:#0b0d10;color:#fff;min-height:100vh;display:grid;place-items:center;margin:0}main{width:min(420px,90vw);background:#171a20;border:1px solid #333;border-radius:20px;padding:30px}h1{margin:0 0 10px}p{color:#b7bac1}.welcome{position:fixed;inset:0;background:#080a0d;display:grid;place-items:center;text-align:center;padding:25px;z-index:5}.welcome[hidden]{display:none}.welcome-inner{animation:pop .75s ease both}.welcome-mark{font-size:52px;color:#e32730;font-weight:900;animation:pulse 1.4s ease-in-out infinite}.welcome h2{font-size:clamp(30px,6vw,52px);margin:12px 0}.welcome p{font-size:18px}@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes pulse{50%{transform:scale(1.1);opacity:.75}}@media(prefers-reduced-motion:reduce){.welcome-inner,.welcome-mark{animation:none}}input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:12px;border-radius:10px;font:inherit}input{background:#0b0d10;color:white;border:1px solid #555}button{background:#d71920;color:white;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5}</style></head><body><main><h1>Roots Grill Cloud</h1><p id="status">Checking your invitation…</p><form id="form" hidden><label>Your full name<input id="fullName" type="text" minlength="2" maxlength="80" autocomplete="name" required placeholder="e.g. Fortune M"></label><label>Create your password<input id="password" type="password" autocomplete="new-password" minlength="12" required placeholder="At least 12 characters"></label><button id="save">Activate manager account</button></form></main><div id="welcome" class="welcome" hidden><div class="welcome-inner"><div class="welcome-mark">RG</div><h2 id="welcomeName">Welcome!</h2><p>Your Roots Grill Cloud workspace is ready.</p><p>Opening your dashboard…</p></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://zvezbdoghzbrsvxazfwo.supabase.co','sb_publishable_IpUt3RpCm0f9Hlyiy_lRkA_GOuhS1pO');
const status=document.getElementById('status'),form=document.getElementById('form'),save=document.getElementById('save');
async function init(){
 const params=new URLSearchParams(location.search);
 if(params.get('error'))throw new Error(params.get('error_description')||params.get('error'));
 if(params.get('code')){const {error}=await db.auth.exchangeCodeForSession(params.get('code'));if(error)throw error;history.replaceState({},'',location.pathname);}
 const {data:{session}}=await db.auth.getSession();
 if(!session)throw new Error('Invitation link is invalid or expired. Ask Head Office for a new invitation.');
 const {data:{user}}=await db.auth.getUser();document.getElementById('fullName').value=typeof user?.user_metadata?.full_name==='string'?user.user_metadata.full_name:'';
 status.textContent='Invitation verified. Confirm your name and create your password.';form.hidden=false;
}
form.addEventListener('submit',async e=>{
 e.preventDefault();save.disabled=true;status.textContent='Activating account…';
 try{
  const fullName=document.getElementById('fullName').value.trim().replace(/\s+/g,' ');
  if(fullName.length<2||fullName.length>80)throw new Error('Enter a name between 2 and 80 characters.');
  const {error}=await db.auth.updateUser({password:document.getElementById('password').value,data:{full_name:fullName}});if(error)throw error;
  const {data:{session}}=await db.auth.getSession();
  const res=await fetch('https://zvezbdoghzbrsvxazfwo.supabase.co/functions/v1/store-accounts',{method:'POST',headers:{'content-type':'application/json','apikey':'sb_publishable_IpUt3RpCm0f9Hlyiy_lRkA_GOuhS1pO','authorization':'Bearer '+session.access_token},body:JSON.stringify({action:'accept'})});
  const result=await res.json();if(!res.ok)throw new Error(result.error||'Activation failed');
  form.hidden=true;document.querySelector('main').hidden=true;document.getElementById('welcomeName').textContent='Welcome, '+fullName.split(/\s+/)[0]+'!';document.getElementById('welcome').hidden=false;
  setTimeout(()=>location.replace('manager-dashboard.html'),1800);
 }catch(err){status.textContent=err.message;}finally{save.disabled=false;}
});
init().catch(err=>{status.textContent=err.message;});
</script></body></html>
