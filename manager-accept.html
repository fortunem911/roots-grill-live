<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roots Grill | Manager Invitation</title><style>body{font:16px system-ui;background:#0b0d10;color:#fff;min-height:100vh;display:grid;place-items:center;margin:0}main{width:min(420px,90vw);background:#171a20;border:1px solid #333;border-radius:20px;padding:30px}h1{margin:0 0 10px}p{color:#b7bac1}input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:12px;border-radius:10px;font:inherit}input{background:#0b0d10;color:white;border:1px solid #555}button{background:#d71920;color:white;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5}</style></head><body><main><h1>Roots Grill Cloud</h1><p id="status">Checking your invitation…</p><form id="form" hidden><label>Create your password<input id="password" type="password" autocomplete="new-password" minlength="12" required placeholder="At least 12 characters"></label><button id="save">Activate manager account</button></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://zvezbdoghzbrsvxazfwo.supabase.co','sb_publishable_IpUt3RpCm0f9Hlyiy_lRkA_GOuhS1pO');
const status=document.getElementById('status'),form=document.getElementById('form'),save=document.getElementById('save');
async function init(){
 const params=new URLSearchParams(location.search);
 if(params.get('error'))throw new Error(params.get('error_description')||params.get('error'));
 if(params.get('code')){const {error}=await db.auth.exchangeCodeForSession(params.get('code'));if(error)throw error;history.replaceState({},'',location.pathname);}
 const {data:{session}}=await db.auth.getSession();
 if(!session)throw new Error('Invitation link is invalid or expired. Ask Head Office for a new invitation.');
 status.textContent='Invitation verified. Set a password to activate your account.';form.hidden=false;
}
form.addEventListener('submit',async e=>{
 e.preventDefault();save.disabled=true;status.textContent='Activating account…';
 try{
  const {error}=await db.auth.updateUser({password:document.getElementById('password').value});if(error)throw error;
  const {data:{session}}=await db.auth.getSession();
  const res=await fetch('https://zvezbdoghzbrsvxazfwo.supabase.co/functions/v1/store-accounts',{method:'POST',headers:{'content-type':'application/json','apikey':'sb_publishable_IpUt3RpCm0f9Hlyiy_lRkA_GOuhS1pO','authorization':'Bearer '+session.access_token},body:JSON.stringify({action:'accept'})});
  const result=await res.json();if(!res.ok)throw new Error(result.error||'Activation failed');
  form.hidden=true;status.textContent='Account activated! Your manager access is ready. Store dashboard coming next.';
 }catch(err){status.textContent=err.message;}finally{save.disabled=false;}
});
init().catch(err=>{status.textContent=err.message;});
</script></body></html>
